<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Xsite Assessment Report</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@4.0.1/dist/pptxgen.bundle.js"></script>
<style>
:root{--navy:#002060;--blue:#0431A6;--or:#E18634;--lor:#FBE7D6;--grey:#F2F2F2;--line:#D0D5E0;--muted:#595959;--ink:#1A1A1A;--ok:#1E7B45;--err:#B42318}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:#E9ECF3;font-size:16px;line-height:1.45;padding-bottom:env(safe-area-inset-bottom,0)}
header{background:var(--navy);color:#fff;padding:calc(14px + env(safe-area-inset-top,0)) 20px 14px;position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;border-bottom:4px solid var(--or)}
header .x{font-weight:700;font-size:28px;color:var(--or);line-height:1}
header h1{font-size:19px;margin:0;flex:1;font-weight:700}
.langs{display:flex;border:1px solid rgba(255,255,255,.4);border-radius:6px;overflow:hidden}
.langs button{background:none;border:0;color:#fff;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer}
.langs button.on{background:var(--or);font-weight:700}
main{max-width:880px;margin:0 auto;padding:20px 14px 60px}
section{background:#fff;border-radius:10px;border:1px solid var(--line);margin-bottom:18px;overflow:hidden}
section>h2{margin:0;padding:14px 18px;font-size:17px;color:var(--navy);display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
section>h2 .n{background:var(--navy);color:#fff;width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:14px;flex:none}
.body{padding:16px 18px}
label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:0 0 5px}
input[type=text],input[type=date],select,textarea{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid #B9C0CF;border-radius:6px;background:#fff;color:var(--ink)}
textarea{min-height:92px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid rgba(4,49,166,.35);outline-offset:1px;border-color:var(--blue)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.full{grid-column:1/-1}
.hint{font-size:13px;color:var(--muted);margin-top:4px}
.search{position:relative}
.results{border:1px solid var(--line);border-radius:6px;margin-top:6px;max-height:320px;overflow:auto}
.results button{display:block;width:100%;text-align:left;background:#fff;border:0;border-bottom:1px solid var(--grey);padding:10px 12px;font:inherit;cursor:pointer}
.results button:hover,.results button:focus{background:#EEF2FB}
.results small{color:var(--muted);display:block;font-size:13px}
.sitecard{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;background:var(--grey);border-left:5px solid var(--navy);border-radius:6px;padding:12px 14px;margin-bottom:16px}
.sitecard b{font-size:18px;color:var(--navy);display:block}
.btn{font:inherit;font-weight:700;border-radius:6px;padding:10px 16px;cursor:pointer;border:1px solid var(--navy);background:#fff;color:var(--navy)}
.btn.primary{background:var(--navy);color:#fff}
.btn.orange{background:var(--or);border-color:var(--or);color:#fff}
.btn.small{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.imp{border-radius:8px;padding:12px;border:1px solid var(--line);background:var(--grey)}
.imp.adv{background:var(--lor);border-color:var(--or)}
.imp label{color:var(--navy);font-size:14px}
.cat{margin-bottom:22px}
.cat h3{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:10px}
.pill{font-size:12px;font-weight:700;padding:3px 10px;border-radius:12px;background:var(--navy);color:#fff}
.pill.adv{background:var(--lor);color:var(--navy);border:1px solid var(--or)}
.photo{display:grid;grid-template-columns:140px 1fr;gap:12px;padding:12px;border:1px solid var(--line);border-radius:8px;margin-bottom:10px}
.photo img{width:140px;height:105px;object-fit:cover;border-radius:4px;background:var(--grey)}
.photo .f{display:grid;gap:8px}
.photo textarea{min-height:64px}
.empty{color:var(--muted);font-size:14px;margin:0 0 10px}
.tr-row{border:1px solid var(--line);border-radius:8px;margin-bottom:10px;overflow:hidden}
.tr-row .k{background:var(--grey);font-size:13px;font-weight:700;color:var(--navy);padding:6px 10px}
.tr-row .cols{display:grid;grid-template-columns:1fr 1fr}
.tr-row .cols>div{padding:8px 10px;white-space:pre-wrap;font-size:14px}
.tr-row .cols>div:first-child{border-right:1px solid var(--line);color:var(--muted)}
.tr-row textarea{min-height:60px;font-size:14px;border:1px solid #D6DAE3}
.tr-row.stale .k{background:#FDECEA;color:var(--err)}
.note{background:#EEF2FB;border-left:4px solid var(--blue);padding:10px 12px;border-radius:4px;font-size:14px;margin-bottom:12px}
.warn{background:#FDECEA;border-left:4px solid var(--err);padding:10px 12px;border-radius:4px;font-size:14px;margin:10px 0 0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.gen{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.gen .btn{font-size:18px;padding:14px 26px}
.status{font-size:13px;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0));transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:8px;font-size:14px;display:none;z-index:50;max-width:90vw}
#toast.err{background:var(--err)}
#busy{position:fixed;inset:0;background:rgba(0,32,96,.55);display:none;align-items:center;justify-content:center;z-index:60;color:#fff;font-size:18px;font-weight:700}
.hide{display:none!important}
@media (max-width:640px){.grid{grid-template-columns:1fr}.photo{grid-template-columns:1fr}.photo img{width:100%;height:180px}.tr-row .cols{grid-template-columns:1fr}.tr-row .cols>div:first-child{border-right:0;border-bottom:1px solid var(--line)}header h1{font-size:16px}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<header><span class="x">X</span><h1 data-t="appTitle"></h1>
<div class="langs" id="langs"><button data-l="en">EN</button><button data-l="es">ES</button><button data-l="pt">PT</button></div></header>
<main>
 <!-- 1 SITE -->
 <section><h2><span class="n">1</span><span data-t="s1"></span></h2><div class="body">
  <div id="pick">
   <div class="search"><input type="text" id="q" autocomplete="off"><div class="results hide" id="res"></div></div>
   <p class="hint" data-t="pickSite"></p>
  </div>
  <div id="picked" class="hide">
   <div class="sitecard"><div><b id="sName"></b><span id="sMeta" class="status"></span></div><button class="btn small" id="chg" data-t="change"></button></div>
   <div class="grid">
    <div class="full"><label for="siteName" data-t="siteName"></label><input type="text" id="siteName"></div>
    <div><label for="lpmd" data-t="lpmd"></label><input type="text" id="lpmd"></div>
    <div><label for="country" data-t="country"></label><select id="country"></select></div>
    <div><label for="date" data-t="date"></label><input type="date" id="date"></div>
    <div><label for="tier" data-t="tier"></label><select id="tier"></select></div>
    <div><label for="city" data-t="city"></label><input type="text" id="city"></div>
    <div><label for="gm" data-t="gm"></label><input type="text" id="gm"></div>
    <div class="full"><label for="resp" data-t="resp"></label><input type="text" id="resp"></div>
    <div><label for="leadName" data-t="lead"></label><input type="text" id="leadName"></div>
    <div><label for="leadRole" data-t="role"></label><input type="text" id="leadRole"></div>
    <div class="full"><label for="coText" data-t="co"></label><textarea id="coText" style="min-height:64px"></textarea></div>
    <div class="full"><label for="participants" data-t="participants"></label><textarea id="participants"></textarea></div>
    <div class="full"><label for="other" data-t="other"></label><input type="text" id="other"></div>
   </div>
  </div>
 </div></section>

 <div id="rest" class="hide">
 <!-- 2 IMPRESSIONS -->
 <section><h2><span class="n">2</span><span data-t="s2"></span></h2><div class="body">
  <p class="hint" style="margin-top:0" data-t="onePerLine"></p>
  <div class="grid">
   <div class="imp"><label for="p_good" data-t="good"></label><textarea id="p_good"></textarea></div>
   <div class="imp adv"><label for="p_advisory" data-t="adv"></label><textarea id="p_advisory"></textarea></div>
   <div class="imp"><label for="p_innov" data-t="inn"></label><textarea id="p_innov"></textarea></div>
   <div class="imp"><label for="p_compl" data-t="com"></label><textarea id="p_compl"></textarea></div>
  </div>
 </div></section>

 <!-- 3 PICTURES -->
 <section><h2><span class="n">3</span><span data-t="s3"></span></h2><div class="body">
  <div class="cat"><h3><span class="pill" data-t="bpName"></span></h3><div id="list_bp"></div>
   <label class="btn small" style="display:inline-block;color:var(--navy)"><span data-t="addPhotos"></span><input type="file" accept="image/*" multiple class="hide" data-cat="bp"></label></div>
  <div class="cat"><h3><span class="pill adv" data-t="adName"></span></h3><div id="list_adv"></div>
   <label class="btn small" style="display:inline-block;color:var(--navy)"><span data-t="addPhotos"></span><input type="file" accept="image/*" multiple class="hide" data-cat="adv"></label></div>
 </div></section>

 <!-- 4 REMARKS -->
 <section><h2><span class="n">4</span><span data-t="s4"></span></h2><div class="body">
  <label for="remarks" data-t="remarksLbl"></label><textarea id="remarks" style="min-height:130px"></textarea>
 </div></section>

 <!-- 5 TRANSLATE (LATAM only) -->
 <section id="trSec" class="hide"><h2><span class="n">5</span><span data-t="s5"></span></h2><div class="body">
  <div class="note" id="biNote"></div>
  <div class="row" style="margin-bottom:12px"><label for="writeLang" style="margin:0" data-t="writingIn"></label>
   <select id="writeLang" style="width:auto"></select>
   <button class="btn orange" id="trBtn" data-t="translateBtn"></button></div>
  <div id="trList"></div>
 </div></section>

 <!-- DOWNLOAD -->
 <section><h2><span class="n" id="dlN">5</span><span data-t="s6"></span></h2><div class="body gen">
  <button class="btn primary" id="gen" data-t="download"></button>
  <div id="genMsg"></div>
  <div class="row"><span class="status" id="saved"></span><button class="btn small" id="clear" data-t="startOver"></button></div>
 </div></section>
 </div>
</main>
<div id="toast"></div><div id="busy"></div>

<script>
// ===== Report builder (PptxGenJS) — shared by the tool and tests =====
const SL = {
 en:{title:'XSITE ASSESSMENT REPORT',foot:'Xsite Assessment Report',siteId:'Site ID',tier:'Assessed tier',date:'Assessment date',assessors:'Assessors',
  s2:'Site & Assessment Information',siteName:'Site name',country:'Country / City',gm:'Site GM',resp:'Xsite Responsible',lead:'Lead assessor',co:'Co-assessor',participants:'Site participants',other:'Other details',
  s3:'Assessor Impressions & Feedback',good:'Good Points',goodS:'What the site does well',adv:'Advisory Points',advS:'Opportunities to improve before the next tier',inn:'Innovations',innS:'New ideas or solutions worth sharing',com:'Compliments',comS:'Recognition for the team and individuals',
  bpT:'Pictures: Best Practice',bp:'BEST PRACTICE',bpS:'Examples worth sharing with other DSV sites',adT:'Pictures: Advice',ad:'ADVICE',adS:'Items the site should address or improve',
  s5:'Final Remarks',msg:'MESSAGE FROM THE ASSESSORS TO THE SITE',rdate:'REPORT DATE',tiers:['Tier 1 – Bronze','Tier 2 – Silver','Tier 3 – Gold','Tier 4 – Platinum','Tier 5 – Diamond'],loc:'en-GB'},
 es:{title:'INFORME DE EVALUACIÓN XSITE',foot:'Informe de evaluación Xsite',siteId:'ID del sitio',tier:'Nivel evaluado',date:'Fecha de evaluación',assessors:'Evaluadores',
  s2:'Información del sitio y de la evaluación',siteName:'Nombre del sitio',country:'País / Ciudad',gm:'Gerente del sitio',resp:'Responsable Xsite',lead:'Evaluador líder',co:'Coevaluador',participants:'Participantes del sitio',other:'Otros detalles',
  s3:'Impresiones y retroalimentación',good:'Puntos fuertes',goodS:'Lo que el sitio hace bien',adv:'Puntos de mejora',advS:'Oportunidades de mejora antes del siguiente nivel',inn:'Innovaciones',innS:'Nuevas ideas o soluciones para compartir',com:'Reconocimientos',comS:'Reconocimiento al equipo y a las personas',
  bpT:'Fotos: Buena práctica',bp:'BUENA PRÁCTICA',bpS:'Ejemplos para compartir con otros sitios DSV',adT:'Fotos: Recomendación',ad:'RECOMENDACIÓN',adS:'Aspectos que el sitio debe atender o mejorar',
  s5:'Comentarios finales',msg:'MENSAJE DE LOS EVALUADORES AL SITIO',rdate:'FECHA DEL INFORME',tiers:['Nivel 1 – Bronce','Nivel 2 – Plata','Nivel 3 – Oro','Nivel 4 – Platino','Nivel 5 – Diamante'],loc:'es-MX'},
 pt:{title:'RELATÓRIO DE AVALIAÇÃO XSITE',foot:'Relatório de avaliação Xsite',siteId:'ID do site',tier:'Nível avaliado',date:'Data da avaliação',assessors:'Avaliadores',
  s2:'Informações do site e da avaliação',siteName:'Nome do site',country:'País / Cidade',gm:'Gerente do site',resp:'Responsável Xsite',lead:'Avaliador líder',co:'Coavaliador',participants:'Participantes do site',other:'Outros detalhes',
  s3:'Impressões e feedback',good:'Pontos fortes',goodS:'O que o site faz bem',adv:'Pontos de melhoria',advS:'Oportunidades de melhoria antes do próximo nível',inn:'Inovações',innS:'Novas ideias ou soluções para compartilhar',com:'Elogios',comS:'Reconhecimento à equipe e às pessoas',
  bpT:'Fotos: Boa prática',bp:'BOA PRÁTICA',bpS:'Exemplos para compartilhar com outros sites DSV',adT:'Fotos: Recomendação',ad:'RECOMENDAÇÃO',adS:'Pontos que o site deve tratar ou melhorar',
  s5:'Considerações finais',msg:'MENSAGEM DOS AVALIADORES AO SITE',rdate:'DATA DO RELATÓRIO',tiers:['Nível 1 – Bronze','Nível 2 – Prata','Nível 3 – Ouro','Nível 4 – Platina','Nível 5 – Diamante'],loc:'pt-BR'}
};

function buildReport(p, R, A){
 p.layout='LAYOUT_WIDE'; p.title='Xsite Assessment Report – '+R.site.name;
 const NAVY='002060',BLUE='0431A6',OR='E18634',GREY='F2F2F2',MUTED='595959',INK='1A1A1A',F='Arial',LOR='FBE7D6',BORDER='BFBFBF';
 const tb=(s,t,o)=>s.addText(t,Object.assign({fontFace:F,margin:0,isTextBox:true},o));
 const fmtDate=(iso,L)=>{if(!iso)return '';const d=new Date(iso+'T12:00:00');return d.toLocaleDateString(L.loc,{day:'numeric',month:'short',year:'numeric'});};
 const lines=t=>(t||'').split(/\r?\n/).map(x=>x.replace(/^\s*[-•*]\s*/,'').trim()).filter(Boolean);
 const fit=(t,base,cap)=>{const n=(t||'').length;return n<cap?base:n<cap*1.6?base-1:n<cap*2.3?base-2:n<cap*3.2?base-3:Math.max(8,base-4);};
 const card=(s,x,y,w,h,o={})=>s.addShape(p.shapes.ROUNDED_RECTANGLE,{x,y,w,h,rectRadius:0.12,fill:{color:o.fill||GREY},line:{color:o.line||NAVY,width:1}});
 const label=(s,t,x,y,w,c=MUTED)=>tb(s,t,{x,y,w,h:0.28,fontSize:11,bold:true,color:c,charSpacing:1.5});
 const circ=(s,ic,x,y,bg,d=0.55)=>{s.addShape(p.shapes.OVAL,{x,y,w:d,h:d,fill:{color:bg},line:{color:bg}});s.addImage({data:A[ic],x:x+d*0.25,y:y+d*0.25,w:d*0.5,h:d*0.5});};
 const T=(obj,lang)=>obj?(obj[lang]||''):'';
 const S=R.site, coNames=lines(R.coText).map(l=>l.split(/\s+[–-]\s+/)[0]);

 for(const lang of R.langs){
  const L=SL[lang], date=fmtDate(R.date,L), tierTxt=L.tiers[R.tier-1]||'';
  const header=(s,t)=>{tb(s,'>>> '+t,{x:0,y:0,w:13.333,h:1.082,fill:{color:NAVY},align:'center',valign:'middle',fontSize:t.length>38?26:32,color:'FFFFFF'});
   tb(s,L.foot+'  |  '+S.name,{x:0.5,y:7.05,w:5.3,h:0.25,fontSize:9,color:'7F7F7F'});
   tb(s,'DSV internal',{x:6.07,y:7.1,w:1.2,h:0.2,fontSize:7,color:'7F7F7F',align:'center'});};
  const assessorLine=[R.lead.name].concat(coNames).filter(Boolean).join(', ');

  // 1 Cover
  let s=p.addSlide(); s.background={data:A.cover};
  tb(s,L.title,{x:1.1,y:1.25,w:4.2,h:0.35,fontSize:14,bold:true,color:OR,charSpacing:2});
  tb(s,S.name,{x:1.1,y:1.7,w:3.9,h:1.25,fontSize:S.name.length>40?24:S.name.length>22?30:36,bold:true,color:'FFFFFF',valign:'top'});
  tb(s,[{text:L.siteId+': '+S.lpmd,options:{breakLine:true}},{text:[R.city,S.country].filter(Boolean).join(', ')}],{x:1.1,y:3.05,w:3.9,h:0.7,fontSize:16,color:'D9E1F2',paraSpaceAfter:4});
  s.addText(L.tier+': '+tierTxt,{shape:p.shapes.ROUNDED_RECTANGLE,rectRadius:0.22,x:1.1,y:4.0,w:3.6,h:0.46,fill:{color:OR},line:{color:OR},fontFace:F,fontSize:14,bold:true,color:'FFFFFF',align:'center',valign:'middle',margin:0});
  tb(s,[{text:L.date+': ',options:{bold:true}},{text:date,options:{breakLine:true}},{text:L.assessors+': ',options:{bold:true}},{text:assessorLine}],{x:1.1,y:4.75,w:4.0,h:1.0,fontSize:13,color:'FFFFFF',paraSpaceAfter:4,valign:'top'});

  // 2 Site & assessment info
  s=p.addSlide(); header(s,L.s2);
  const fields=[[L.date,date],[L.siteId,S.lpmd],[L.siteName,S.name],[L.country,[S.country,R.city].filter(Boolean).join(', ')],[L.tier,tierTxt],[L.gm,R.gm||'—']];
  const gx=0.5,gy=1.45,cw=3.55,ch=1.15,gap=0.3;
  fields.forEach((f,i)=>{const x=gx+(i%2)*(cw+gap),y=gy+Math.floor(i/2)*(ch+0.2);card(s,x,y,cw,ch);label(s,f[0].toUpperCase(),x+0.25,y+0.2,cw-0.5);
   tb(s,f[1],{x:x+0.25,y:y+0.48,w:cw-0.5,h:0.55,fontSize:f[1].length>26?13:f[1].length>18?15:18,bold:true,color:NAVY,valign:'top'});});
  {const y=gy+3*(ch+0.2),w=2*cw+gap;card(s,gx,y,w,ch,{fill:'D9E1F2'});circ(s,'FaUserTie',gx+0.25,y+0.3,NAVY);
   label(s,L.resp.toUpperCase(),gx+0.95,y+0.2,w-1.2,NAVY);
   tb(s,R.resp||'—',{x:gx+0.95,y:y+0.48,w:w-1.2,h:0.55,fontSize:(R.resp||'').length>45?13:16,bold:true,color:NAVY,valign:'top'});}
  const rx=gx+2*cw+gap+0.4,rw=13.333-0.5-rx;
  card(s,rx,gy,rw,2.55);circ(s,'FaUserCheck',rx+0.25,gy+0.25,NAVY);label(s,L.assessors.toUpperCase(),rx+0.95,gy+0.38,rw-1.2);
  const aTxt=[R.lead.name?(R.lead.name+(R.lead.role?' – '+R.lead.role:'')+' ('+L.lead.toLowerCase()+')'):''].concat(lines(R.coText)).filter(Boolean).join('\n');
  tb(s,aTxt,{x:rx+0.25,y:gy+1.0,w:rw-0.5,h:1.4,fontSize:fit(aTxt,14,110),color:INK,valign:'top'});
  const y2=gy+2.85;card(s,rx,y2,rw,2.55);circ(s,'FaUsers',rx+0.25,y2+0.25,BLUE);label(s,L.participants.toUpperCase(),rx+0.95,y2+0.38,rw-1.2);
  const other=T(R.other,lang), pTxt=lines(R.participants).join('\n')+(other?'\n\n'+L.other+': '+other:'');
  tb(s,pTxt,{x:rx+0.25,y:y2+1.0,w:rw-0.5,h:1.45,fontSize:fit(pTxt,13,120),color:INK,valign:'top'});

  // 3 Impressions
  s=p.addSlide(); header(s,L.s3);
  const boxes=[['good',L.good,L.goodS,'FaThumbsUp',NAVY],['advisory',L.adv,L.advS,'FaExclamation',OR],['innov',L.inn,L.innS,'FaLightbulb',BLUE],['compl',L.com,L.comS,'FaStar',NAVY]];
  const bw=5.99,bh=2.55;
  boxes.forEach((b,i)=>{const [k,t,sub,ic,col]=b,x=0.5+(i%2)*(bw+0.35),y=1.4+Math.floor(i/2)*(bh+0.3),adv=col===OR;
   card(s,x,y,bw,bh,{fill:adv?LOR:GREY,line:adv?OR:NAVY});circ(s,ic,x+0.25,y+0.25,col);
   tb(s,t.toUpperCase(),{x:x+0.95,y:y+0.25,w:bw-1.2,h:0.3,fontSize:14,bold:true,color:NAVY,charSpacing:1.5});
   tb(s,sub,{x:x+0.95,y:y+0.55,w:bw-1.2,h:0.25,fontSize:11,color:MUTED});
   const pts=lines(T(R.points[k],lang)), all=pts.join(' ');
   if(pts.length){const sz=Math.min(fit(all,13,230),pts.length>6?10:pts.length>4?11:13);
    tb(s,pts.map((t,j)=>({text:t,options:{bullet:true,breakLine:j<pts.length-1}})),{x:x+0.25,y:y+0.95,w:bw-0.5,h:1.45,fontSize:sz,color:INK,valign:'top',paraSpaceAfter:3});}
   else tb(s,'—',{x:x+0.25,y:y+0.95,w:bw-0.5,h:0.4,fontSize:13,color:MUTED});});

  // 4 Pictures (3 per slide, repeated as needed)
  [['bp',L.bpT,L.bp,L.bpS,true],['adv',L.adT,L.ad,L.adS,false]].forEach(([k,title,pill,sub,bp])=>{
   const ph=R.photos[k]||[];
   for(let c=0;c<ph.length;c+=3){const chunk=ph.slice(c,c+3),n=Math.ceil(ph.length/3);
    const sl=p.addSlide(); header(sl,title+(n>1?' ('+(c/3+1)+'/'+n+')':''));
    sl.addText(pill,{shape:p.shapes.ROUNDED_RECTANGLE,rectRadius:0.17,x:0.5,y:1.3,w:2.3,h:0.36,fill:{color:bp?NAVY:LOR},line:{color:bp?NAVY:OR,width:1.25},fontFace:F,fontSize:11,bold:true,color:bp?'FFFFFF':NAVY,charSpacing:1,align:'center',valign:'middle',margin:0});
    tb(sl,sub,{x:2.95,y:1.3,w:8,h:0.36,fontSize:12,color:MUTED,valign:'middle'});

     const bx=x+0.2,by=y+0.2,bW=pw-0.4,bH=2.75;
     sl.addShape(p.shapes.RECTANGLE,{x:bx,y:by,w:bW,h:bH,fill:{color:GREY},line:{color:GREY}});
     const r=Math.min(bW/f.w,bH/f.h),iw=f.w*r,ih=f.h*r;
     sl.addImage({data:f.data,x:bx+(bW-iw)/2,y:by+(bH-ih)/2,w:iw,h:ih});
     const area=T(f.area,lang),cap=T(f.caption,lang);
     if(area)label(sl,area.toUpperCase(),x+0.2,y+3.12,pw-0.4,NAVY);
     tb(sl,cap,{x:x+0.2,y:y+(area?3.47:3.12),w:pw-0.4,h:area?1.3:1.65,fontSize:fit(cap,12,170),color:INK,valign:'top'});});
   }});

  // 5 Final remarks
  s=p.addSlide(); header(s,L.s5);
  card(s,0.5,1.4,12.33,3.9);circ(s,'FaCommentDots',0.75,1.65,NAVY);label(s,L.msg,1.45,1.78,10.5);
  const rem=T(R.remarks,lang);
  tb(s,rem,{x:0.75,y:2.45,w:11.8,h:2.65,fontSize:fit(rem,15,500),color:INK,valign:'top'});
  const sx=[0.5,4.73,8.96],sl2=[[L.lead.toUpperCase(),R.lead.name||'—'],[L.co.toUpperCase(),coNames.join(', ')||'—'],[L.rdate,fmtDate(R.reportDate,L)]];

   tb(s,v[1],{x:sx[i]+0.25,y:6.08,w:3.4,h:0.5,fontSize:v[1].length>28?12:16,bold:true,color:NAVY,valign:'top'});});
 }

 $('q').placeholder=t('searchPh');
 const tv=$('tier').value;$('tier').innerHTML='<option value="">'+t('pickTier')+'</option>'+t('tiers').map((x,i)=>'<option value="'+(i+1)+'">'+x+'</option>').join('');$('tier').value=tv;
 if(site){const L=localLangOf(curCountry());if(L){$('biNote').textContent=t('bi').replace('{L}',t('langName')[L]);
  const wl=writeLang;$('writeLang').innerHTML=['en',L].map(x=>'<option value="'+x+'">'+t('langName')[x]+'</option>').join('');$('writeLang').value=wl;}}
 renderPhotos();renderTrans();if(site)$('saved').textContent=t('saved');
}
document.querySelectorAll('#langs button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;applyLang();});

// ---------- Sites ----------
function parseCSV(txt){const rows=[];let r=[],f='',q=false;for(let i=0;i<txt.length;i++){const c=txt[i];
 if(q){if(c==='"'){if(txt[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
 else if(c==='"')q=true;else if(c===','){r.push(f);f='';}else if(c==='\n'||c==='\r'){if(c==='\r'&&txt[i+1]==='\n')i++;r.push(f);rows.push(r);r=[];f='';}else f+=c;}
 if(f||r.length){r.push(f);rows.push(r);}return rows.filter(x=>x.some(v=>v.trim()));}
async function loadSites(){
 try{const res=await fetch(SITES_FILE+'?v='+Date.now());if(!res.ok)throw 0;const rows=parseCSV(await res.text());
  const h=rows[0].map(x=>x.toLowerCase());const col=test=>h.findIndex(test);
  const ic=col(x=>x.includes('country')),il=col(x=>x.includes('lpmd')||x.includes('code')),ig=col(x=>x.includes('gm')),in_=col(x=>x.includes('site name')),ir=col(x=>x.includes('responsible')||x.includes('ci/po'));
  SITES=rows.slice(1).map(r=>({country:(r[ic]||'').trim(),lpmd:(r[il]||'').trim(),gm:(r[ig]||'').trim(),name:(r[in_]||'').trim(),resp:(r[ir]||'').trim()})).filter(s=>s.lpmd||s.name);
 }catch(e){toast(t('sitesErr'),true);}
}
$('q').addEventListener('input',()=>{const v=$('q').value.trim().toLowerCase(),box=$('res');
 if(!v){box.classList.add('hide');return;}
 const m=SITES.map((s,i)=>[s,i]).filter(([s])=>(s.name+' '+s.lpmd+' '+s.country).toLowerCase().includes(v)).slice(0,40);
 box.innerHTML=m.length?m.map(([s,i])=>'<button data-i="'+i+'">'+esc(s.name)+'<small>'+esc(s.lpmd)+' · '+esc(s.country)+'</small></button>').join(''):'<div style="padding:10px 12px" class="status">'+t('noMatch')+'</div>';
 box.classList.remove('hide');});
$('res').addEventListener('click',e=>{const b=e.target.closest('button');if(b)selectSite(SITES[+b.dataset.i]);});
$('chg').onclick=()=>{site=null;$('picked').classList.add('hide');$('rest').classList.add('hide');$('pick').classList.remove('hide');$('q').value='';$('res').classList.add('hide');$('q').focus();};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const draftKey=()=>'xsiteReport:'+site.lpmd+'|'+site.name;

async function selectSite(s){
 site=s;TEXT_IDS.forEach(id=>$(id).value='');photos={bp:[],adv:[]};trans={};
 const cs=COUNTRIES.includes(s.country)?COUNTRIES:COUNTRIES.concat(s.country?[s.country]:[]);
 $('country').innerHTML=cs.map(c=>'<option>'+esc(c)+'</option>').join('');
 $('siteName').value=s.name;$('lpmd').value=s.lpmd;$('country').value=s.country;
 $('date').value=new Date().toISOString().slice(0,10);
 $('gm').value=s.gm&&s.gm!=='TBD'?s.gm:'';$('resp').value=s.resp&&s.resp!=='TBD'?s.resp:'';
 const L=localLangOf(s.country);writeLang=L||'en';lang=L||'en';
 
 $('pick').classList.add('hide');$('picked').classList.remove('hide');$('rest').classList.remove('hide');
 const restored=await loadDraft();refreshSite();applyLang();$('writeLang').value=writeLang;
 if(restored)toast(t('restored'));
}

function refreshSite(){const L=localLangOf(curCountry());
 $('sName').textContent=$('siteName').value||site.name;$('sMeta').textContent=[$('lpmd').value,curCountry()].filter(Boolean).join(' · ');
 $('trSec').classList.toggle('hide',!L);$('dlN').textContent=L?'6':'5';
 if(L&&writeLang!=='en'&&writeLang!==L)writeLang=L;if(!L)writeLang='en';}
['siteName','lpmd'].forEach(id=>$(id).addEventListener('input',refreshSite));
$('country').addEventListener('change',()=>{refreshSite();const L=localLangOf(curCountry());lang=L||'en';applyLang();$('writeLang').value=writeLang;saveDraft();});

// ---------- Drafts (text in localStorage, photos in IndexedDB) ----------
let saveTimer;
function saveDraft(){clearTimeout(saveTimer);saveTimer=setTimeout(doSave,600);}
async function doSave(){clearTimeout(saveTimer);if(!site)return;
 const d={v:{},trans,writeLang,meta:{bp:photos.bp.map(p=>({id:p.id,area:p.area,caption:p.caption})),adv:photos.adv.map(p=>({id:p.id,area:p.area,caption:p.caption}))}};
 TEXT_IDS.forEach(id=>d.v[id]=$(id).value);
 try{localStorage.setItem(draftKey(),JSON.stringify(d));}catch(e){}
 try{await idbPut(draftKey(),{bp:photos.bp.map(p=>({id:p.id,data:p.data,w:p.w,h:p.h})),adv:photos.adv.map(p=>({id:p.id,data:p.data,w:p.w,h:p.h}))});}catch(e){}
 $('saved').textContent=t('saved');}
window.addEventListener('pagehide',doSave);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')doSave();});
async function loadDraft(){let d=null;try{d=JSON.parse(localStorage.getItem(draftKey())||'null');}catch(e){}
 if(!d)return false;TEXT_IDS.forEach(id=>{if(d.v[id]!=null)$(id).value=d.v[id];});trans=d.trans||{};writeLang=d.writeLang||writeLang;
 try{const imgs=await idbGet(draftKey());if(imgs)['bp','adv'].forEach(c=>{photos[c]=(imgs[c]||[]).map(p=>{const m=(d.meta&&d.meta[c]||[]).find(x=>x.id===p.id)||{};return Object.assign({},p,{area:m.area||'',caption:m.caption||''});});});}catch(e){}
 return true;}
function idb(){return new Promise((ok,no)=>{const r=indexedDB.open('xsiteReports',1);r.onupgradeneeded=()=>r.result.createObjectStore('photos');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error);});}
async function idbPut(k,v){const db=await idb();return new Promise((ok,no)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').put(v,k);tx.oncomplete=ok;tx.onerror=()=>no(tx.error);});}
async function idbGet(k){const db=await idb();return new Promise((ok,no)=>{const r=db.transaction('photos').objectStore('photos').get(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error);});}
async function idbDel(k){const db=await idb();return new Promise(ok=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').delete(k);tx.oncomplete=ok;});}
TEXT_IDS.forEach(id=>$(id).addEventListener('input',()=>{saveDraft();markStale();}));
$('tier').addEventListener('change',saveDraft);
$('clear').onclick=async()=>{if(!site||!confirm(t('confirmClear')))return;localStorage.removeItem(draftKey());try{await idbDel(draftKey());}catch(e){}const s=site;localStorage.removeItem(draftKey());await selectSite(s);localStorage.removeItem(draftKey());};

// ---------- Photos ----------
function compress(file){return new Promise((ok,no)=>{const u=URL.createObjectURL(file),im=new Image();
 im.onload=()=>{const max=1400,r=Math.min(1,max/Math.max(im.width,im.height)),w=Math.round(im.width*r),h=Math.round(im.height*r);
  const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);URL.revokeObjectURL(u);
  ok({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),data:c.toDataURL('image/jpeg',0.78),w,h,area:'',caption:''});};
 im.onerror=()=>{URL.revokeObjectURL(u);no(new Error(file.name));};im.src=u;});}
document.querySelectorAll('input[type=file]').forEach(inp=>inp.addEventListener('change',async()=>{
 const cat=inp.dataset.cat;for(const f of inp.files){try{photos[cat].push(await compress(f));}catch(e){toast('Could not read '+e.message,true);}}
 inp.value='';renderPhotos();saveDraft();markStale();}));
function renderPhotos(){['bp','adv'].forEach(cat=>{const el=$('list_'+cat);if(!el)return;
 el.innerHTML=photos[cat].length?photos[cat].map((p,i)=>'<div class="photo"><img src="'+p.data+'" alt=""><div class="f">'+
  '<input type="text" placeholder="'+esc(t('area'))+'" aria-label="'+esc(t('area'))+'" value="'+esc(p.area)+'" data-c="'+cat+'" data-i="'+i+'" data-k="area">'+
  '<textarea placeholder="'+esc(t('expl'))+'" aria-label="'+esc(t('expl'))+'" data-c="'+cat+'" data-i="'+i+'" data-k="caption">'+esc(p.caption)+'</textarea>'+
  '<div><button class="btn small" data-rm="'+cat+':'+i+'">'+t('remove')+'</button></div></div></div>').join(''):'<p class="empty">'+t('noPhotos')+'</p>';});}
document.addEventListener('input',e=>{const d=e.target.dataset;if(d&&d.k){photos[d.c][+d.i][d.k]=e.target.value;saveDraft();markStale();}});
document.addEventListener('click',e=>{const r=e.target.dataset&&e.target.dataset.rm;if(r){const [c,i]=r.split(':');photos[c].splice(+i,1);renderPhotos();saveDraft();}});

// ---------- Translation ----------
function transFields(){const f=[['other',t('other'),$('other').value],['p_good',t('good'),$('p_good').value],['p_advisory',t('adv'),$('p_advisory').value],['p_innov',t('inn'),$('p_innov').value],['p_compl',t('com'),$('p_compl').value]];
 ['bp','adv'].forEach(c=>photos[c].forEach((p,i)=>{const n=(c==='bp'?t('bpName'):t('adName'))+' '+(i+1);f.push(['ph:'+p.id+':area',n+' – '+t('area'),p.area]);f.push(['ph:'+p.id+':caption',n+' – '+t('expl'),p.caption]);}));
 f.push(['remarks',t('remarksLbl'),$('remarks').value]);return f.filter(x=>x[2].trim());}
const isStale=(k,v)=>!trans[k]||trans[k].src!==v||trans[k].from!==writeLang;
function markStale(){if(!site||!localLangOf(curCountry()))return;clearTimeout(markStale.h);markStale.h=setTimeout(renderTrans,400);}
function renderTrans(){const el=$('trList');if(!el||!site||!localLangOf(curCountry()))return;const f=transFields();
 el.innerHTML=f.filter(([k])=>trans[k]).map(([k,n,v])=>'<div class="tr-row'+(isStale(k,v)?' stale':'')+'"><div class="k">'+esc(n)+(isStale(k,v)?' – '+t('stale'):'')+'</div><div class="cols"><div>'+esc(v)+'</div><div><textarea data-tk="'+esc(k)+'" aria-label="'+esc(t('trans'))+'">'+esc(trans[k].out)+'</textarea></div></div></div>').join('');}
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.tk;if(k&&trans[k]){trans[k].out=e.target.value;saveDraft();}});
$('writeLang').addEventListener('change',()=>{writeLang=$('writeLang').value;saveDraft();renderTrans();});
$('trBtn').onclick=async()=>{
 if(!TRANSLATE_URL||TRANSLATE_URL.indexOf('http')!==0){toast(t('noUrl'),true);return;}
 const L=localLangOf(curCountry()),target=writeLang==='en'?L:'en';
 const todo=transFields().filter(([k,,v])=>isStale(k,v));if(!todo.length){renderTrans();return;}
 const b=$('trBtn');b.disabled=true;b.textContent=t('translating');
 try{const res=await fetch(TRANSLATE_URL,{method:'POST',body:JSON.stringify({source:writeLang,target,texts:todo.map(x=>x[2])})});
  const j=await res.json();if(!j.translations)throw new Error(j.error||'no data');
  todo.forEach(([k,,v],i)=>trans[k]={src:v,from:writeLang,out:j.translations[i]||''});saveDraft();renderTrans();$('genMsg').innerHTML='';
 }catch(e){toast(t('trErr')+e.message,true);}
 b.disabled=false;b.textContent=t('translateBtn');};

// ---------- Generate ----------
$('gen').onclick=async()=>{doSave();
 const miss=[];if(!$('siteName').value.trim())miss.push(t('siteName'));if(!$('lpmd').value.trim())miss.push(t('lpmd'));if(!$('date').value)miss.push(t('date'));if(!$('tier').value)miss.push(t('tier'));if(!$('leadName').value.trim())miss.push(t('lead'));
 const msg=$('genMsg');msg.innerHTML='';
 if(miss.length){msg.innerHTML='<div class="warn">'+esc(t('missing')+miss.join(', '))+'</div>';return;}
 const L=localLangOf(curCountry());
 if(L){const f=transFields();if(f.some(([k,,v])=>isStale(k,v))){msg.innerHTML='<div class="warn">'+esc(Object.keys(trans).length?t('staleMsg'):t('needTr'))+'</div>';return;}}
 const both=(k,v)=>{if(!L)return {en:v};const o=trans[k]?trans[k].out:'';return writeLang==='en'?{en:v,[L]:o}:{en:o,[L]:v};};
 const cur={lpmd:$('lpmd').value.trim(),name:$('siteName').value.trim(),country:curCountry()};
 const R={langs:L?['en',L]:['en'],site:cur,city:$('city').value.trim(),gm:$('gm').value.trim(),resp:$('resp').value.trim(),date:$('date').value,reportDate:new Date().toISOString().slice(0,10),tier:+$('tier').value,
  lead:{name:$('leadName').value.trim(),role:$('leadRole').value.trim()},coText:$('coText').value,participants:$('participants').value,
  other:both('other',$('other').value.trim()),remarks:both('remarks',$('remarks').value.trim()),
  points:{good:both('p_good',$('p_good').value),advisory:both('p_advisory',$('p_advisory').value),innov:both('p_innov',$('p_innov').value),compl:both('p_compl',$('p_compl').value)},
  photos:{}};
 ['bp','adv'].forEach(c=>R.photos[c]=photos[c].map(p=>({data:p.data,w:p.w,h:p.h,area:both('ph:'+p.id+':area',p.area.trim()),caption:both('ph:'+p.id+':caption',p.caption.trim())})));
 const busy=$('busy');busy.textContent=t('building');busy.style.display='flex';
 try{const p=new PptxGenJS();buildReport(p,R,ASSETS);
  const fn='Xsite_Assessment_'+cur.lpmd.replace(/[^\w-]/g,'')+'_'+R.date+'.pptx';await p.writeFile({fileName:fn});toast(t('done')+fn);
 }catch(e){msg.innerHTML='<div class="warn">'+esc(e.message)+'</div>';}
 busy.style.display='none';};

// ---------- Start ----------
applyLang();loadSites();
</script>
</body>
</html>
